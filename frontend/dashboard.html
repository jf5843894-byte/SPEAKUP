<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak UP — Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">🎙️ Speak <span>UP</span></div>
    <div class="nav-right">
      <span class="nav-user" id="navUser">👤 Usuario</span>
      <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </nav>

  <!-- Main -->
  <main class="dashboard">
    <div class="dash-welcome">
      <h2>¡Bienvenido, <span id="welcomeName">Usuario</span>! 👋</h2>
      <p>¿Qué quieres practicar hoy?</p>
    </div>

    <div class="dash-cards">
      <div class="dash-card" onclick="window.location='record.html'">
        <div class="dash-card-icon">🎥</div>
        <h3>Nueva práctica</h3>
        <p>Graba o sube un video de tu exposición</p>
        <span class="dash-card-badge">EP002</span>
      </div>

     <div class="dash-card" onclick="window.location='results.html'">
        <div class="dash-card-icon">🤖</div>
        <h3>Análisis con IA</h3>
        <p>Revisa tu habla, gestos y postura</p>
        <span class="dash-card-badge">EP003</span>
     </div>
     
      <div class="dash-card disabled">
        <div class="dash-card-icon">📊</div>
        <h3>Mis reportes</h3>
        <p>Historial de resultados y recomendaciones</p>
        <span class="dash-card-badge coming">Próximamente</span>
      </div>
    </div>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
