<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak UP — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo + nombre -->
      <div class="brand">
        <div class="brand-icon">🎙️</div>
        <h1 class="brand-name">Speak <span>UP</span></h1>
        <p class="brand-sub">Mejora tu comunicación con IA</p>
      </div>

      <!-- Banner de error (oculto por defecto) -->
      <div class="banner banner-error hidden" id="bannerError">
        ⚠️ Correo o contraseña incorrectos. Inténtalo de nuevo.
      </div>

      <!-- Banner de éxito (oculto por defecto) -->
      <div class="banner banner-success hidden" id="bannerSuccess">
        ✅ Credenciales verificadas. Ingresando...
      </div>

      <!-- Formulario -->
      <form id="loginForm" novalidate>

        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
          />
          <span class="field-msg" id="emailMsg"></span>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-pw" id="togglePw" title="Mostrar/ocultar">👁️</button>
          </div>
          <span class="field-msg" id="passMsg"></span>
        </div>

        <div class="row-options">
          <label class="check-label">
            <input type="checkbox" id="remember" />
            Recordar sesión
          </label>
          <a href="recover.html" class="link-small">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Barra de progreso (visible solo en estado éxito) -->
        <div class="progress-bar hidden" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <button type="submit" class="btn-primary" id="btnLogin">
          Iniciar sesión
        </button>

      </form>

      <p class="footer-note">¿No tienes cuenta? <a href="#">Regístrate</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
